name: Update README with Latest Blog Posts

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Fetch latest blog posts
        uses: gautamkrishnar/blog-post-workflow@1.9.3
        with:
          feed_list: "https://khaodoes.dev/blog.rss"
          date_format: "mmm dd, yyyy"
          description_max_length: 180
          template: |
            <div>
              <sub>$date</sub><br/>
              <strong><a href="$url">$title</a></strong><br/>
              $description
            </div>
            <br/>
